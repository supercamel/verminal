name: Release

# Builds Linux AppImages, the Windows installer, and Android APKs with
# sqgipkg, then publishes them as release assets.
#
# Push a tag like `v1.0.0` to cut a release, or run the workflow manually to
# produce build artifacts without publishing.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # appimagetool runs as an AppImage; GitHub runners cannot always mount FUSE,
  # so extract-and-run instead of mounting.
  APPIMAGE_EXTRACT_AND_RUN: '1'
  # Let sqgipkg provision Gradle 8.9 instead of using the runner's version.
  GRADLE_HOME: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Verminal
        uses: actions/checkout@v4
        with:
          path: Verminal

      - name: Checkout sqgi (runtime + sqgipkg)
        uses: actions/checkout@v4
        with:
          repository: supercamel/sqgi
          path: sqgi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git file ca-certificates wget \
            meson valac gobject-introspection \
            libglib2.0-dev libgirepository1.0-dev libffi-dev libcairo2-dev libgtk-4-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user-static binfmt-support \
            mingw-w64 nsis squashfs-tools unzip curl libgdk-pixbuf-2.0-dev \
            llvm-18-dev libxml2-utils gir1.2-soup-3.0

      - name: Set up Java for Android packaging
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and install sqgi
        run: |
          cmake -S sqgi -B sqgi/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSQ_ENABLE_JIT=ON
          cmake --build sqgi/build
          sudo cmake --install sqgi/build --prefix /usr/local
          sudo ldconfig

      - name: Prepare Android toolchain
        working-directory: Verminal
        run: |
          # Hosted runners select their own NDK by default. Use the revision
          # required by sqgipkg's Android SDK for setup and subsequent builds.
          verminal_android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK path is missing}}"
          export ANDROID_NDK_HOME="$verminal_android_sdk/ndk/28.2.13676358"
          printf 'ANDROID_NDK_HOME=%s\n' "$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          sqgipkg setup --platform android --native-tools --accept-licenses

      - name: Validate all platforms
        working-directory: Verminal
        run: sqgipkg check --target all

      - name: Build all platforms
        working-directory: Verminal
        run: sqgipkg build --target all --write-lock

      - name: Collect artifacts
        working-directory: Verminal
        run: |
          mkdir -p artifacts
          cp dist-linux-x86_64/Verminal.AppImage    artifacts/Verminal-x86_64.AppImage
          cp dist-linux-aarch64/Verminal.AppImage   artifacts/Verminal-aarch64.AppImage
          cp dist-windows-x86_64/Verminal-Setup.exe artifacts/Verminal-Setup.exe
          cp dist-android-arm64-v8a/*.apk dist-android-x86_64/*.apk artifacts/
          cp sqgipkg.lock.json artifacts/
          ls -lh artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verminal-builds
          path: Verminal/artifacts/*

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: Verminal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --clobber
